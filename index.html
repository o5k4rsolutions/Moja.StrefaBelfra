async function boot(){
 $("#out").onclick=logout;
 const hide=()=>{const x=$("#splash");if(!x)return;x.classList.add("gone");setTimeout(()=>x.remove(),500)};
 try{
  const h=new URLSearchParams(location.hash.slice(1));
  if(h.get("access_token")&&h.get("refresh_token")){
   const {error}=await sb.auth.setSession({access_token:h.get("access_token"),refresh_token:h.get("refresh_token")});
   history.replaceState(null,"",location.pathname+location.search+"#/pulpit");
   if(error)return location.replace(LOGIN_URL+"/?r=exp");
  }
  const {data:{session}}=await sb.auth.getSession();
  if(!session)return location.replace(LOGIN_URL);
  user=session.user;await loadMe();
  sb.auth.onAuthStateChange(ev=>{if(ev==="SIGNED_OUT"&&!leaving)location.replace(LOGIN_URL+"/?r=out")});
  addEventListener("hashchange",route);await route();hide();if(me.role!=="admin"&&(!me.onboarded||me.decl_year!==SY))onboard();
 }catch(e){hide();app(`<div class="card"><p class="err">Nie udało się wczytać konta: ${esc(e.message)}</p><button class="btn" data-act="out">Wyloguj i spróbuj ponownie</button></div>`)}

async function route(){
 const [p,a]=(location.hash.slice(2)||"pulpit").split("/");nav(p);tbar(1);

  if(!["pulpit","ustawienia"].includes(p)&&!ok())return app(banner());

 }catch(e){app(`<p class="err">Błąd: ${esc(e.message)}</p>`)}finally{tbar(0)}
}

  if(r&&r.n!==undefined)o={w:r.w,p:r.p,m:r.m,c:r.c,id:r.id,n:r.n,u:r.u,nr:r.nr,l:r.l,k:r.k};
  else{const a=Array.isArray(r)?r:null,c=a?null:(r.attributes||r),g=i=>{const v=a?a[i-1]:c["col"+i];return v&&typeof v==="object"?(v.repr||v.val||""):(v??"")};

/* KLUB */
const F={s:"",c:"",t:"",q:"",f:""};let MAT=null;
async function vKlub(re){
 if(!MAT||!re){const {data,error}=await sb.from("materials").select("*").order("created_at",{ascending:false}).limit(1000);if(error)throw error;MAT=data}
 const mi=mine();
 if(!mi.length)return app(`<div class="ph"><h1>Klub Nauczyciela</h1></div><div class="card"><b>Brak odblokowanych przedmiotów</b><p class="mu">Klub pokazuje materiały tylko z przedmiotów, które zadeklarowałeś i które zostały zweryfikowane.</p><a class="btn s" href="#/ustawienia">Uzupełnij deklarację</a></div>`);
 const base=MAT.filter(m=>mi.includes(m.subject));
 if(F.s&&!mi.includes(F.s))F.s="";
 const bs=F.s?base.filter(m=>m.subject===F.s):base,cl=CLS.filter(c=>bs.some(m=>m.class===c));
 if(F.c&&!cl.includes(F.c))F.c="";
 const bc=F.c?bs.filter(m=>m.class===F.c):bs,tp=TYPES.filter(t=>bc.some(m=>m.type===t));
 if(F.t&&!tp.includes(F.t))F.t="";
 const chips=(k,l,a,cnt)=>`<div class="chips"><span class="cl">${l}</span>${a.map(x=>`<button class="chip ${F[k]===x?"on":""}" data-k="${k}" data-v="${esc(x)}">${esc(x.replace("Klasa ","Kl. "))}${cnt?`<em>${cnt(x)}</em>`:""}</button>`).join("")}</div>`;
 app(`<div class="ph"><small class="ey">Rok szkolny ${SY}</small><h1>Klub Nauczyciela</h1><p class="mu">Materiały z Twoich przedmiotów – sprawdziany, karty pracy i scenariusze.</p></div>
 <div class="tbr"><input id="ks" type="search" placeholder="Szukaj w tytułach…" value="${esc(F.q||"")}"><button class="chip ${F.f?"on":""}" data-k="f" data-v="1">${ic(IC.star)}Ulubione</button></div>
 <div class="fil">${chips("s","Przedmiot",mi,x=>base.filter(m=>m.subject===x).length)}${cl.length?chips("c","Klasa",cl):""}${tp.length?chips("t","Rodzaj",tp):""}</div><div id="list" class="mg"></div>`);
 klubGrid();
}
function klubGrid(){
 const mi=mine(),fv=fav(),q=norm(F.q||"");
 const d=MAT.filter(m=>mi.includes(m.subject)&&(!F.s||m.subject===F.s)&&(!F.c||m.class===F.c)&&(!F.t||m.type===F.t)&&(!F.f||fv.has(String(m.id)))&&(!q||norm(m.title).includes(q)));
 $("#list").innerHTML=d.map(m=>{const n=(m.class.match(/\d+/)||[""])[0],nw=Date.now()-new Date(m.created_at)<12096e5,k=`data-key="${esc(m.file_key)}" data-name="${esc(m.title)}"`;
  return `<article class="bk"><div class="cov ${sc(m.subject)}" data-act="prev" ${k}>${nw?'<span class="new">NOWE</span>':""}<span class="cb">Strefa Belfra</span><span class="cn">${esc(n)}</span><span class="cs">${esc(m.subject)}</span><span class="ct">${esc(m.type)}</span><button class="star ${fv.has(String(m.id))?"on":""}" data-act="fav" data-id="${m.id}" aria-label="Ulubione">${ic(IC.star)}</button></div><h3>${esc(m.title)}</h3><div class="ma"><button class="btn s" data-act="prev" ${k}>Podgląd</button><button class="btn s o" data-act="report" data-kind="material" data-ref="${m.id}" data-label="Materiał: ${esc(m.title)}" data-link="#/klub">Zgłoś</button></div></article>`}).join("")||"<p class='mu'>Brak materiałów dla wybranych filtrów.</p>";
}
async function preview(b){
 modal('<div class="spin"></div><p class="mu" style="text-align:center">Ładowanie podglądu…</p>',1);
 const {url}=await fn("b2",{action:"get",key:b.dataset.key}),ext=b.dataset.key.split(".").pop().toLowerCase(),e=encodeURIComponent(url);
 const v=ext==="pdf"?`<iframe src="${url}#toolbar=0"></iframe>`:["png","jpg","jpeg","gif","webp"].includes(ext)?`<img src="${url}">`:["doc","docx","ppt","pptx","xls","xlsx"].includes(ext)?`<iframe src="https://view.officeapps.live.com/op/embed.aspx?src=${e}"></iframe>`:`<iframe src="https://docs.google.com/gview?embedded=1&url=${e}"></iframe>`;
 modal(`<div class="mh"><b>${esc(b.dataset.name)}</b>${XB}</div>${v}`,1);
}
function report(b){const d=b.dataset;modal(`<h2>Zgłoś problem</h2><form data-form="rep" data-kind="${esc(d.kind)}" data-ref="${esc(d.ref)}" data-label="${esc(d.label)}" data-link="${esc(d.link)}"><textarea name="reason" required maxlength="2000" placeholder="Opisz, o co chodzi…"></textarea><p><button class="btn">Wyślij zgłoszenie</button> <button type="button" class="btn o" data-act="close">Anuluj</button></p></form>`)}

/* FORUM */
const vForum=id=>id?vThread(id):vThreads();
async function vThreads(){

async function vThread(id){
 const [{data:t},{data:ps}]=await Promise.all([sb.from("threads").select("*").eq("id",id).single(),sb.from("posts").select("*").eq("thread_id",id).order("created_at")]);
 const adm=me.role==="admin",rb=(k,r,l)=>`<button class="link" data-act="report" data-kind="${k}" data-ref="${r}" data-label="${esc(l)}" data-link="#/forum/${id}">Zgłoś</button>`,dl=(tb,i)=>adm?` <button class="link err" data-act="del" data-tbl="${tb}" data-id="${i}">Usuń</button>`:"";
 app(`<p><a class="btn o s" href="#/forum">${ic(IC.back)} Wszystkie wątki</a></p><div class="card"><h1>${esc(t.title)}</h1><small>${esc(t.author_name)} · ${when(t.created_at)}</small><p style="white-space:pre-wrap">${esc(t.body)}</p>${rb("thread",t.id,"Wątek: "+t.title)}${dl("threads",t.id)}</div>
 <h2>Odpowiedzi (${ps.length})</h2>${ps.map(p=>`<div class="card"><small><b>${esc(p.author_name)}</b> · ${when(p.created_at)}</small><p style="white-space:pre-wrap">${esc(p.body)}</p>${rb("post",p.id,"Wiadomość w wątku: "+t.title)}${dl("posts",p.id)}</div>`).join("")}
 <form data-form="reply" data-id="${id}" class="card"><textarea name="body" required maxlength="5000" placeholder="Napisz odpowiedź…"></textarea><p><button class="btn">Odpowiedz</button></p></form>`);
}

/* USTAWIENIA */
async function vUst(){
 app(`<h1>Ustawienia</h1><div class="card"><form data-form="name" class="bar"><input name="f" value="${esc(me.first_name)}" required placeholder="Imię"><input name="l" value="${esc(me.last_name)}" required placeholder="Nazwisko"><button class="btn">Zapisz imię i nazwisko</button></form><p><b>E-mail:</b> ${esc(me.email)}<br><b>ID użytkownika:</b> <small>${me.id}</small></p></div>

/* ADMIN */
async function vAdmin(sub="users"){
 if(me.role!=="admin")return app("<p>Brak uprawnień.</p>");
 const tb=[["users","Użytkownicy"],["materials","Materiały"],["reports","Zgłoszenia"]];
 const head=`<h1>Panel administratora</h1><div class="bar">${tb.map(([k,l])=>`<a class="btn ${sub===k?"":"o"} s" href="#/admin/${k}">${l}</a>`).join("")}</div>`;
 if(sub==="users"){
  U=(await sb.from("profiles").select("*").order("created_at",{ascending:false}).limit(500)).data;
  app(head+`<input id="us" placeholder="Szukaj użytkownika…" style="width:100%;margin-bottom:10px"><div class="card" style="overflow:auto"><table id="ut"></table></div>`);usersTbl("");
 }
 if(sub==="materials"){
  const {data}=await sb.from("materials").select("*").order("created_at",{ascending:false}).limit(200);
  app(head+`<form data-form="up" class="card"><b>Dodaj materiał do Klubu</b><div class="bar" style="margin-top:8px"><input name="title" required placeholder="Tytuł"><select name="subject">${opts(SUBJ)}</select><select name="cls">${opts(CLS)}</select><select name="type">${opts(TYPES)}</select><input type="file" name="file" required></div><button class="btn">Wyślij</button> <span id="upst"></span></form>${data.map(m=>`<div class="card row"><span><b>${esc(m.title)}</b> <span class="tag">${esc(m.subject)}</span><span class="tag">${esc(m.class)}</span><span class="tag">${esc(m.type)}</span></span><button class="btn s d" data-act="delmat" data-id="${m.id}" data-key="${esc(m.file_key)}">Usuń</button></div>`).join("")}`);
 }
 if(sub==="reports"){
  const {data}=await sb.from("reports").select("*").order("created_at",{ascending:false}).limit(200);
  app(head+(data.map(r=>`<div class="card"><div class="row"><b>${esc(r.label)}</b><small><span class="pill ${r.status==="open"?"r":"g"}">${r.status==="open"?"otwarte":"zamknięte"}</span> · ${esc(r.reporter_name)} · ${when(r.created_at)}</small></div><p style="white-space:pre-wrap">${esc(r.reason)}</p>${r.reply?`<p class="ok">Odpowiedź: ${esc(r.reply)}</p>`:""}<a class="btn s o" href="${esc(r.link)}">Przejdź</a> <button class="btn s" data-act="rrep" data-id="${r.id}">Odpisz</button> ${r.status==="open"?`<button class="btn s o" data-act="rclose" data-id="${r.id}">Zamknij</button>`:""}</div>`).join("")||"<p class='mu'>Brak zgłoszeń.</p>"));
 }
}
function usersTbl(q){
 q=q.toLowerCase();
 $("#ut").innerHTML=`<tr><th>Imię i nazwisko</th><th>E-mail</th><th>Rola</th><th>Przedmioty</th><th>Nauczyciel</th><th>Akcje</th></tr>`+U.filter(u=>(u.first_name+u.last_name+u.email).toLowerCase().includes(q)).map(u=>`<tr><td>${esc(u.first_name)} ${esc(u.last_name)}</td><td>${esc(u.email)}</td><td>${u.role}</td><td><small>${esc((u.subjects||[]).join(", ")||"—")}<br>${esc(u.decl_year||"")}</small></td><td>${u.verified?`<span class="pill g">tak</span>`:"—"}</td><td>
 <button class="btn s o" data-act="uv" data-id="${u.id}">${u.verified?"Odbierz upr.":"Nadaj upr."}</button> <button class="btn s o" data-act="ur" data-id="${u.id}">${u.role==="admin"?"→ user":"→ admin"}</button> <button class="btn s o" data-act="un" data-id="${u.id}">Imię/nazwisko</button> <button class="btn s o" data-act="ue" data-id="${u.id}">E-mail</button> <button class="btn s o" data-act="up" data-id="${u.id}">Hasło</button> <button class="btn s d" data-act="ud" data-id="${u.id}">Usuń</button></td></tr>`).join("");
}
const adm=(u,p)=>sb.rpc("admin_update_profile",{uid:u.id,f:p.f??u.first_name,l:p.l??u.last_name,r:p.r??u.role,v:p.v??u.verified}).then(({error})=>{if(error)throw error;return vAdmin("users")});
const gu=b=>U.find(u=>u.id===b.dataset.id);

/* ZDARZENIA */
const acts={
 fav:b=>{const f=fav(),i=b.dataset.id;f.has(i)?f.delete(i):f.add(i);try{localStorage.setItem("fav"+user.id,JSON.stringify([...f]))}catch{}klubGrid()},out:logout,close,pdf:()=>makePdf().catch(e=>toastE("Nie udało się wygenerować PDF: "+e.message)),ob:()=>onboard(1),ob2:()=>onboard(2),
 resch:()=>{ob.school=null;onboard(1)},prev:b=>preview(b).catch(e=>modal(`<p class="err">Błąd podglądu: ${esc(e.message)}</p><button class="btn" data-act="close">OK</button>`)),
 pick:b=>{const {s,...x}=R[b.dataset.i];ob.school=x;onboard(1)},report,nt:()=>$("#nt").hidden=false,
 save:async()=>{if(!ob.subjects.length)return toastE("Wybierz co najmniej jeden przedmiot.");
  const {error}=await sb.from("profiles").update({school:ob.school,subjects:ob.subjects,onboarded:true,decl_year:SY}).eq("id",user.id);if(error)return toastE(error.message);
  await loadMe();ob=null;nav("pulpit");onboard(3);route()},
 del:async b=>{if(!await C("Usunąć?"))return;await sb.from(b.dataset.tbl).delete().eq("id",b.dataset.id);location.hash=b.dataset.tbl==="threads"?"#/forum":"#/forum/"+location.hash.split("/")[2];route()},
 uv:b=>{const u=gu(b);adm(u,{v:!u.verified})},ur:async b=>{const u=gu(b);if(await C("Zmienić rolę?"))adm(u,{r:u.role==="admin"?"user":"admin"})},
 un:async b=>{const u=gu(b),f=await P("Imię",u.first_name);if(!f)return;const l=await P("Nazwisko",u.last_name);if(l)adm(u,{f,l})},
 ue:async b=>{const u=gu(b),e=await P("Nowy e-mail",u.email);if(e){await fn("admin-users",{action:"email",id:u.id,email:e});vAdmin("users")}},
 up:async b=>{const p=await P("Nowe hasło (min. 8 znaków)");if(p&&p.length>=8){await fn("admin-users",{action:"password",id:gu(b).id,password:p});toast("Hasło zmienione")}},
 ud:async b=>{if(await C("Usunąć konto bezpowrotnie?")){await fn("admin-users",{action:"delete",id:b.dataset.id});vAdmin("users")}},
 delmat:async b=>{if(!await C("Usunąć materiał?"))return;await fn("b2",{action:"del",key:b.dataset.key});await sb.from("materials").delete().eq("id",b.dataset.id);vAdmin("materials")},
 rrep:async b=>{const t=await P("Odpowiedź dla zgłaszającego:");if(t){await sb.from("reports").update({reply:t,status:"closed"}).eq("id",b.dataset.id);vAdmin("reports")}},
 rclose:async b=>{await sb.from("reports").update({status:"closed"}).eq("id",b.dataset.id);vAdmin("reports")}
};
const forms={
 rep:async f=>{const d=f.dataset;const {error}=await sb.from("reports").insert({kind:d.kind,ref_id:d.ref,label:d.label,link:d.link,reason:f.reason.value.trim(),reporter_name:name()});modal(error?`<p class="err">${esc(error.message)}</p>`:`<h2>Dziękujemy!</h2><p>Zgłoszenie zostało wysłane do administratora.</p><button class="btn" data-act="close">OK</button>`)},
 nt:async f=>{const {data,error}=await sb.from("threads").insert({title:f.title.value.trim(),body:f.body.value.trim(),author_name:name()}).select("id").single();if(error)return toastE(error.message);location.hash="#/forum/"+data.id},
 reply:async f=>{const {error}=await sb.from("posts").insert({thread_id:f.dataset.id,body:f.body.value.trim(),author_name:name()});if(error)return toastE(error.message);vThread(f.dataset.id)},
 name:async f=>{const {error}=await sb.from("profiles").update({first_name:f.f.value.trim(),last_name:f.l.value.trim()}).eq("id",user.id);if(error)return toastE(error.message);await loadMe();toast("Zapisano")},
 pw:async f=>{const {error}=await sb.auth.updateUser({password:f.p.value});error?toast(error.message,1):toast("Hasło zostało zmienione");if(!error)f.reset()},
 up:async f=>{const st=$("#upst"),file=f.file.files[0],ct=file.type||"application/octet-stream";
  try{st.textContent="Wysyłanie…";const key=`materialy/${Date.now()}-${file.name.replace(/[^\w.-]+/g,"_")}`;
  const {url}=await fn("b2",{action:"put",key,contentType:ct});
  const r=await fetch(url,{method:"PUT",headers:{"Content-Type":ct},body:file});if(!r.ok)throw Error("Backblaze odrzucił plik ("+r.status+")");
  const {error}=await sb.from("materials").insert({title:f.title.value.trim(),subject:f.subject.value,class:f.cls.value,type:f.type.value,file_key:key,file_name:file.name,created_by:user.id});if(error)throw error;vAdmin("materials")
  }catch(e){st.innerHTML=`<span class="err">${esc(e.message)}</span>`}}
};
document.addEventListener("click",e=>{const ch=e.target.closest(".chip");if(ch){F[ch.dataset.k]=F[ch.dataset.k]===ch.dataset.v?"":ch.dataset.v;return void vKlub(1)}const b=e.target.closest("[data-act]");if(!b)return;const r=acts[b.dataset.act]?.(b);if(r?.then&&b.classList.contains("btn")){b.classList.add("ld");r.finally(()=>b.classList.remove("ld"))}});
document.addEventListener("submit",e=>{const f=e.target;if(f.dataset.form){e.preventDefault();const r=forms[f.dataset.form]?.(f),bt=f.querySelector(".btn");if(r?.then&&bt){bt.classList.add("ld");r.finally(()=>bt.classList.remove("ld"))}}});
document.addEventListener("change",e=>{const t=e.target;
 if(t.dataset.k){F[t.dataset.k]=t.value;vKlub()}
 if(t.dataset.sub){ob.subjects=t.checked?[...ob.subjects,t.dataset.sub]:ob.subjects.filter(x=>x!==t.dataset.sub)}});
document.addEventListener("input",async e=>{
 if(e.target.id==="ks"){F.q=e.target.value;return klubGrid()}
 if(e.target.id==="us")usersTbl(e.target.value);
 if(e.target.id!=="q")return;
 const v=norm(e.target.value).trim(),res=$("#res");
 if(v.length<3)return res.innerHTML="<small>Wpisz min. 3 znaki</small>";

 const t=v.split(/\s+/);R=SCH.filter(s=>t.every(w=>s.s.includes(w))).slice(0,25);
 res.innerHTML=R.map((s,i)=>`<button class="it" data-act="pick" data-i="${i}"><b>${esc(s.n)}</b><br><small>${esc(addr(s))} · ${esc(s.w)}</small></button>`).join("")||"<small>Nie znaleziono placówki.</small>";
});
boot();
