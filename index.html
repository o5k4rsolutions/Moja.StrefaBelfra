async function vThreads(){
 const {data}=await sb.from("threads").select("id,title,author_name,created_at").order("created_at",{ascending:false}).limit(100);
 app(`<div class="row"><span class="mu">Rozmowy nauczycieli</span><button class="btn" data-act="nt">+ Nowy wątek</button></div><form data-form="nt" id="nt" class="pn" hidden><input name="title" required maxlength="150" placeholder="Tytuł wątku" style="width:100%;margin-bottom:10px"><textarea name="body" required maxlength="5000" placeholder="Treść"></textarea><p><button class="btn">Opublikuj</button></p></form>${(data||[]).map(thr).join("")||"<p class='mu'>Brak wątków. Bądź pierwszy!</p>"}`);
}
async function vThread(id){
 const [{data:t},{data:ps}]=await Promise.all([sb.from("threads").select("*").eq("id",id).single(),sb.from("posts").select("*").eq("thread_id",id).order("created_at")]);
 const adm=me.role==="admin",rb=(k,r,l)=>`<button class="link" data-act="report" data-kind="${k}" data-ref="${r}" data-label="${esc(l)}" data-link="#/forum/${id}">Zgłoś</button>`,dl=(tb,i)=>adm?` <button class="link err" data-act="del" data-tbl="${tb}" data-id="${i}">Usuń</button>`:"";
 app(`<p><a class="btn o s" href="#/forum">${ic(IC.back)}Wszystkie wątki</a></p><div class="pn"><h2>${esc(t.title)}</h2><small>${esc(t.author_name)}, ${when(t.created_at)}</small><p style="white-space:pre-wrap">${esc(t.body)}</p>${rb("thread",t.id,"Wątek: "+t.title)}${dl("threads",t.id)}</div>
 <h2 style="margin-top:8px">Odpowiedzi (${ps.length})</h2>${ps.map(p=>`<div class="card"><small><b>${esc(p.author_name)}</b>, ${when(p.created_at)}</small><p style="white-space:pre-wrap">${esc(p.body)}</p>${rb("post",p.id,"Wiadomość w wątku: "+t.title)}${dl("posts",p.id)}</div>`).join("")}
 <form data-form="reply" data-id="${id}" class="pn"><textarea name="body" required maxlength="5000" placeholder="Napisz odpowiedź…"></textarea><p><button class="btn">Odpowiedz</button></p></form>`);
}

/* USTAWIENIA */
async function vUst(){
 app(`${ok()?"":banner()}<div class="pn"><h2>Dane konta</h2><form data-form="name" class="bar" style="margin:14px 0"><input name="f" value="${esc(me.first_name)}" required placeholder="Imię"><input name="l" value="${esc(me.last_name)}" required placeholder="Nazwisko"><button class="btn">Zapisz</button></form><p class="sm" style="margin:0"><b>E-mail:</b> ${esc(me.email)}<br><b>ID użytkownika:</b> <small>${me.id}</small></p></div>
 <div class="pn"><h2>Placówka i przedmioty</h2><p><b>Placówka:</b> ${me.school?esc(me.school.n)+", "+esc(addr(me.school)):"brak"}<br><b>Przedmioty:</b> ${esc((me.subjects||[]).join(", ")||"brak")}<br><b>Deklaracja na rok ${SY}:</b> ${me.decl_year===SY?"złożona":"wymagana"}</p><div class="bar"><button class="btn o" data-act="ob">Zmień placówkę i przedmioty</button><button class="btn o" data-act="pdf" ${me.onboarded?"":"disabled"}>${ic(IC.dl)}Pobierz oświadczenie</button></div></div>
 <div class="pn"><h2>Hasło</h2><form data-form="pw" class="bar" style="margin-top:14px"><input type="password" name="p" minlength="8" required placeholder="Nowe hasło (min. 8 znaków)"><button class="btn">Zmień hasło</button></form></div>`);
}

/* ADMIN */
async function vAdmin(sub){
 sub=location.hash.split("/")[2]||"users";
 if(me.role!=="admin")return app("<p>Brak uprawnień.</p>");
 const tb=[["users","Użytkownicy"],["materials","Materiały"],["reports","Zgłoszenia"]];
 const head=`<div class="tabs">${tb.map(([k,l])=>`<a class="tab ${sub===k?"on":""}" href="#/admin/${k}" style="text-decoration:none">${l}</a>`).join("")}</div>`;
 if(sub==="users"){
  U=(await sb.from("profiles").select("*").order("created_at",{ascending:false}).limit(500)).data;
  app(head+`<section class="pn"><input id="us" placeholder="Szukaj użytkownika…" style="width:100%;margin-bottom:12px"><div style="overflow:auto"><table id="ut"></table></div></section>`);usersTbl("");
 }
 if(sub==="materials"){
  const {data}=await sb.from("materials").select("*").order("created_at",{ascending:false}).limit(200);
  app(head+`<form data-form="up" class="pn"><h2>Dodaj materiał do Klubu</h2><div class="bar" style="margin:14px 0"><input name="title" required placeholder="Tytuł"><select name="subject">${opts(SUBJ)}</select><select name="cls">${opts(CLS)}</select><select name="type">${opts(TYPES)}</select><input type="file" name="file" required></div><button class="btn">Wyślij</button> <span id="upst"></span></form>${data.map(m=>`<div class="card row"><span><b>${esc(m.title)}</b> <span class="tag">${esc(m.subject)}</span><span class="tag">${esc(m.class)}</span><span class="tag">${esc(m.type)}</span></span><button class="btn s d" data-act="delmat" data-id="${m.id}" data-key="${esc(m.file_key)}">Usuń</button></div>`).join("")}`);
 }
 if(sub==="reports"){
  const {data}=await sb.from("reports").select("*").order("created_at",{ascending:false}).limit(200);
  app(head+(data.map(r=>`<div class="pn"><div class="row"><b>${esc(r.label)}</b><small><span class="pill ${r.status==="open"?"r":"g"}">${r.status==="open"?"otwarte":"zamknięte"}</span> ${esc(r.reporter_name)}, ${when(r.created_at)}</small></div><p style="white-space:pre-wrap">${esc(r.reason)}</p>${r.reply?`<p class="ok">Odpowiedź: ${esc(r.reply)}</p>`:""}<div class="bar"><a class="btn s o" href="${esc(r.link)}">Przejdź</a><button class="btn s" data-act="rrep" data-id="${r.id}">Odpisz</button>${r.status==="open"?`<button class="btn s o" data-act="rclose" data-id="${r.id}">Zamknij</button>`:""}</div></div>`).join("")||"<p class='mu'>Brak zgłoszeń.</p>"));
 }
}
function usersTbl(q){
 q=q.toLowerCase();
 $("#ut").innerHTML=`<tr><th>Imię i nazwisko</th><th>E-mail</th><th>Rola</th><th>Przedmioty</th><th>Nauczyciel</th><th>Akcje</th></tr>`+U.filter(u=>(u.first_name+u.last_name+u.email).toLowerCase().includes(q)).map(u=>`<tr><td>${esc(u.first_name)} ${esc(u.last_name)}</td><td>${esc(u.email)}</td><td>${u.role}</td><td><small>${esc((u.subjects||[]).join(", ")||"-")}<br>${esc(u.decl_year||"")}</small></td><td>${u.verified?`<span class="pill g">tak</span>`:"-"}</td><td><div class="bar">
 <button class="btn s o" data-act="uv" data-id="${u.id}">${u.verified?"Odbierz upr.":"Nadaj upr."}</button><button class="btn s o" data-act="ur" data-id="${u.id}">${u.role==="admin"?"→ user":"→ admin"}</button><button class="btn s o" data-act="un" data-id="${u.id}">Imię/nazwisko</button><button class="btn s o" data-act="ue" data-id="${u.id}">E-mail</button><button class="btn s o" data-act="up" data-id="${u.id}">Hasło</button><button class="btn s d" data-act="ud" data-id="${u.id}">Usuń</button></div></td></tr>`).join("");
}
const adm=(u,p)=>sb.rpc("admin_update_profile",{uid:u.id,f:p.f??u.first_name,l:p.l??u.last_name,r:p.r??u.role,v:p.v??u.verified}).then(({error})=>{if(error)throw error;return vAdmin()});
const gu=b=>U.find(u=>u.id===b.dataset.id);

/* ZDARZENIA */
const acts={
 fav:b=>{const f=fav(),i=b.dataset.id;f.has(i)?f.delete(i):f.add(i);ss("fav",[...f]);if($("#cnt"))klubList();else b.classList.toggle("on")},
 out:logout,close,pdf:()=>makePdf().catch(e=>toastE("Nie udało się wygenerować PDF: "+e.message)),ob:()=>onboard(1),ob2:()=>onboard(2),
 resch:()=>{ob.school=null;onboard(1)},prev:b=>preview(b).catch(e=>modal(`<p class="err">Błąd podglądu: ${esc(e.message)}</p><button class="btn" data-act="close">OK</button>`)),
 dl:b=>dlFile(b.dataset.key,b.dataset.name,b.dataset.id).catch(e=>toastE("Nie udało się pobrać: "+e.message)),
 dsel:async()=>{const l=MAT.filter(m=>S.has(String(m.id)));try{for(const m of l){await dlFile(m.file_key,m.title,m.id);await new Promise(r=>setTimeout(r,500))}toast(`Pobrano plików: ${l.length}`)}catch(e){toastE("Nie udało się pobrać: "+e.message)}},
 more:()=>{F.n+=20;klubList()},clr:()=>{Object.assign(F,{q:"",s:"",c:"",t:"",n:20});vKlub()},
 pick:b=>{const {s,...x}=R[b.dataset.i];ob.school=x;onboard(1)},report,nt:()=>$("#nt").hidden=false,
 save:async()=>{if(!ob.subjects.length)return toastE("Wybierz co najmniej jeden przedmiot.");
  const {error}=await sb.from("profiles").update({school:ob.school,subjects:ob.subjects,onboarded:true,decl_year:SY}).eq("id",user.id);if(error)return toastE(error.message);
  await loadMe();ob=null;nav("pulpit");onboard(3);route()},
 del:async b=>{if(!await C("Usunąć?"))return;await sb.from(b.dataset.tbl).delete().eq("id",b.dataset.id);location.hash=b.dataset.tbl==="threads"?"#/forum":"#/forum/"+location.hash.split("/")[2];route()},
 uv:b=>{const u=gu(b);adm(u,{v:!u.verified})},ur:async b=>{const u=gu(b);if(await C("Zmienić rolę?"))adm(u,{r:u.role==="admin"?"user":"admin"})},
 un:async b=>{const u=gu(b),f=await P("Imię",u.first_name);if(!f)return;const l=await P("Nazwisko",u.last_name);if(l)adm(u,{f,l})},
 ue:async b=>{const u=gu(b),e=await P("Nowy e-mail",u.email);if(e){await fn("admin-users",{action:"email",id:u.id,email:e});vAdmin()}},
 up:async b=>{const p=await P("Nowe hasło (min. 8 znaków)");if(p&&p.length>=8){await fn("admin-users",{action:"password",id:gu(b).id,password:p});toast("Hasło zmienione")}},
 ud:async b=>{if(await C("Usunąć konto bezpowrotnie?")){await fn("admin-users",{action:"delete",id:b.dataset.id});vAdmin()}},
 delmat:async b=>{if(!await C("Usunąć materiał?"))return;await fn("b2",{action:"del",key:b.dataset.key});await sb.from("materials").delete().eq("id",b.dataset.id);MAT=null;vAdmin()},
 rrep:async b=>{const t=await P("Odpowiedź dla zgłaszającego:");if(t){await sb.from("reports").update({reply:t,status:"closed"}).eq("id",b.dataset.id);vAdmin()}},
 rclose:async b=>{await sb.from("reports").update({status:"closed"}).eq("id",b.dataset.id);vAdmin()}
};
const forms={
 rep:async f=>{const d=f.dataset;const {error}=await sb.from("reports").insert({kind:d.kind,ref_id:d.ref,label:d.label,link:d.link,reason:f.reason.value.trim(),reporter_name:name()});modal(error?`<p class="err">${esc(error.message)}</p>`:`<h2>Dziękujemy!</h2><p>Zgłoszenie zostało wysłane do administratora. Odpowiedź zobaczysz pod dzwonkiem.</p><button class="btn" data-act="close">OK</button>`)},
 nt:async f=>{const {data,error}=await sb.from("threads").insert({title:f.title.value.trim(),body:f.body.value.trim(),author_name:name()}).select("id").single();if(error)return toastE(error.message);location.hash="#/forum/"+data.id},
 reply:async f=>{const {error}=await sb.from("posts").insert({thread_id:f.dataset.id,body:f.body.value.trim(),author_name:name()});if(error)return toastE(error.message);vThread(f.dataset.id)},
 name:async f=>{const {error}=await sb.from("profiles").update({first_name:f.f.value.trim(),last_name:f.l.value.trim()}).eq("id",user.id);if(error)return toastE(error.message);await loadMe();toast("Zapisano")},
 pw:async f=>{const {error}=await sb.auth.updateUser({password:f.p.value});error?toast(error.message,1):toast("Hasło zostało zmienione");if(!error)f.reset()},
 up:async f=>{const st=$("#upst"),file=f.file.files[0],ct=file.type||"application/octet-stream";
  try{st.textContent="Wysyłanie…";const key=`materialy/${Date.now()}-${file.name.replace(/[^\w.-]+/g,"_")}`;
  const {url}=await fn("b2",{action:"put",key,contentType:ct});
  const r=await fetch(url,{method:"PUT",headers:{"Content-Type":ct},body:file});if(!r.ok)throw Error("Backblaze odrzucił plik ("+r.status+")");
  const {error}=await sb.from("materials").insert({title:f.title.value.trim(),subject:f.subject.value,class:f.cls.value,type:f.type.value,file_key:key,file_name:file.name,created_by:user.id});if(error)throw error;MAT=null;vAdmin()
  }catch(e){st.innerHTML=`<span class="err">${esc(e.message)}</span>`}}
};
document.addEventListener("click",e=>{
 const tb=e.target.closest("[data-tab]");if(tb){F.tab=tb.dataset.tab;F.n=20;return void vKlub()}
 const vv=e.target.closest("[data-v]");if(vv){F.v=vv.dataset.v;document.querySelectorAll("[data-v]").forEach(x=>x.classList.toggle("on",x===vv));return klubList()}
 if(e.target===$("#modal"))return close();
 const b=e.target.closest("[data-act]");if(!b)return;const r=acts[b.dataset.act]?.(b);if(r?.then&&b.classList.contains("btn")){b.classList.add("ld");r.finally(()=>b.classList.remove("ld"))}});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("#modal").hidden)close();if(e.key==="/"&&$("#ks")&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)){e.preventDefault();$("#ks").focus()}});
document.addEventListener("submit",e=>{const f=e.target;if(f.dataset.form){e.preventDefault();const r=forms[f.dataset.form]?.(f),bt=f.querySelector(".btn");if(r?.then&&bt){bt.classList.add("ld");r.finally(()=>bt.classList.remove("ld"))}}});
document.addEventListener("change",e=>{const t=e.target;
 if(t.dataset.k){F[t.dataset.k]=t.value;F.n=20;klubList()}
 if(t.dataset.sel){const i=t.dataset.sel;t.checked?S.add(i):S.delete(i);selUi()}
 if(t.dataset.sub){ob.subjects=t.checked?[...ob.subjects,t.dataset.sub]:ob.subjects.filter(x=>x!==t.dataset.sub)}});
document.addEventListener("input",async e=>{
 if(e.target.id==="ks"){F.q=e.target.value;F.n=20;return klubList()}
 if(e.target.id==="us")usersTbl(e.target.value);
 if(e.target.id!=="q")return;
 const v=norm(e.target.value).trim(),res=$("#res");
 if(v.length<3)return res.innerHTML="<small>Wpisz min. 3 znaki</small>";
 if(!SCH){res.innerHTML="<small>Ładuję listę placówek…</small>";try{await loadSchools()}catch(x){return res.innerHTML=`<span class="err">Nie można wczytać placowki.json</span>`}}
 const t=v.split(/\s+/);R=SCH.filter(s=>t.every(w=>s.s.includes(w))).slice(0,25);
 res.innerHTML=R.map((s,i)=>`<button class="it" data-act="pick" data-i="${i}"><b>${esc(s.n)}</b><br><small>${esc(addr(s))}, ${esc(s.w)}</small></button>`).join("")||"<small>Nie znaleziono placówki.</small>";
});
boot();
</script></body></html>
