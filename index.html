<!DOCTYPE html>
<html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>Moja Strefa Belfra</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{--fg:#14213D;--or:#FF7A1A;--gr:#2E9A52;--line:#E3E8F2;--bg:#F6F8FC;--mu:#55627F;--er:#C62828}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.55 Poppins,system-ui,sans-serif}
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:16px;padding:10px 20px;background:#fff;border-bottom:1px solid var(--line);flex-wrap:wrap}
.top img{height:34px;display:block}nav{display:flex;gap:4px;flex:1;flex-wrap:wrap}
nav a{padding:8px 14px;border-radius:999px;color:var(--fg);text-decoration:none;font-weight:600;font-size:14px}nav a.on{background:var(--fg);color:#fff}nav a.lk{opacity:.45}
main{max-width:980px;margin:0 auto;padding:28px 16px 60px}h1{font-size:26px;margin:0 0 16px}h2{font-size:18px;margin:24px 0 10px}
.card,.tile{background:#fff;border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}.tile{text-decoration:none;color:inherit;font-weight:600;transition:transform .3s}.tile:hover{transform:translateY(-3px)}
.btn{border:0;cursor:pointer;background:var(--or);color:var(--fg);font:600 14px Poppins,sans-serif;padding:10px 20px;border-radius:999px;text-decoration:none;display:inline-block}
.btn.o{background:#fff;border:1.5px solid var(--line)}.btn.s{padding:6px 12px;font-size:12px}.btn.d{background:#FDECEA;color:var(--er)}.btn:disabled{opacity:.5}
.link{background:none;border:0;font:600 13px Poppins;text-decoration:underline;cursor:pointer;color:var(--fg)}
.warn{background:#FFF4E8;border:1.5px solid var(--or);border-radius:20px;padding:18px;margin-bottom:20px}.ok{color:var(--gr);font-weight:600}.err{color:var(--er)}
input,select,textarea{font:inherit;padding:10px 12px;border:1.5px solid var(--line);border-radius:12px;background:#fff;max-width:100%}textarea{width:100%;min-height:100px}
.bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}.row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.tag{display:inline-block;font-size:12px;background:var(--bg);border-radius:999px;padding:2px 10px;margin-right:4px}small,.mu{color:var(--mu)}
#modal{position:fixed;inset:0;background:rgba(20,33,61,.55);display:grid;place-items:center;z-index:20;padding:12px}#modal[hidden]{display:none}
#mb{background:#fff;border-radius:24px;padding:24px;width:100%;max-width:560px;max-height:92vh;overflow:auto}#mb.w{max-width:960px}
#mb iframe,#mb img{width:100%;height:75vh;border:0;border-radius:12px}#mb img{height:auto;max-height:75vh;object-fit:contain}
.mh{display:flex;justify-content:space-between;margin-bottom:10px}.mh button{border:0;background:none;font-size:20px;cursor:pointer}
.it{display:block;width:100%;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:8px 12px;margin-top:6px;cursor:pointer;font:inherit}.it:hover{border-color:var(--or)}
.chk{display:block;padding:6px 0;cursor:pointer}.chk input{accent-color:var(--or);margin-right:8px}table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left}
</style></head><body>
<header class="top"><a href="https://strefabelfra.pages.dev"><img src="https://strefabelfra.pages.dev/themes/logo-kolor.svg" alt="Strefa Belfra"></a><nav id="nav"></nav><button class="link" id="out">Wyloguj</button></header>
<main id="app">Ładowanie…</main><div id="modal" hidden><div id="mb"></div></div>
<script type="module">

const SUPABASE_URL="https://zmnscevlotwpocpwzmjj.supabase.co", SUPABASE_ANON_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InptbnNjZXZsb3R3cG9jcHd6bWpqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI5MzcwMzAsImV4cCI6MjEwODUxMzAzMH0.qB4WcrlkDb75Buk0G2E1-jkun0VLWih7h1j9NEb2IXk";
const LOGIN_URL="https://login-strefabelfra.pages.dev", SITE="https://strefabelfra.pages.dev";
const GEN_URL="#"; 
import {createClient} from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/+esm";
const sb=createClient(SUPABASE_URL,SUPABASE_ANON_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const SUBJ=["Język Polski","Matematyka","Przyroda","Biologia","Geografia","Fizyka","Chemia","Informatyka","Wiedza o Społeczeństwie","Historia"];
const TYPES=["Sprawdzian","Kartkówka","Karta pracy","Scenariusz lekcji"],CLS=[1,2,3,4,5,6,7,8].map(n=>"Klasa "+n);
const MAIL="cok_moja@strefabelfra.int.pl";
let me,user,SCH,R,ob,U=[];
const app=h=>$("#app").innerHTML=h,modal=(h,w)=>{$("#mb").className=w?"w":"";$("#mb").innerHTML=h;$("#modal").hidden=false},close=()=>$("#modal").hidden=true;
const when=d=>new Date(d).toLocaleString("pl-PL",{dateStyle:"short",timeStyle:"short"});
const ok=()=>me.verified||me.role==="admin",name=()=>me.first_name+" "+me.last_name;
const fn=async(n,b)=>{const r=await sb.functions.invoke(n,{body:b});if(r.error)throw r.error;return r.data};
const opts=(a,sel)=>a.map(x=>`<option ${x===sel?"selected":""}>${x}</option>`).join("");
const street=s=>s.u?`${s.u} ${s.nr||""}${s.l?"/"+s.l:""}`:`${s.m} ${s.nr||""}`;
const addr=s=>`${street(s)}, ${s.k||""} ${s.m}`;

const banner=()=>`<div class="warn"><b>Musimy zweryfikować Twoje dane!</b><p>Aby uzyskać dostęp do materiałów, prześlij skan lub wyraźne zdjęcie podbitego i podpisanego oświadczenia na adres <a href="mailto:${MAIL}">${MAIL}</a><br>Odpowiemy w ciągu 5 dni roboczych.</p>${me.onboarded?`<button class="btn" data-act="pdf">Pobierz oświadczenie</button>`:`<button class="btn" data-act="ob">Uzupełnij dane</button>`}</div>`;

async function boot(){
 const {data:{session}}=await sb.auth.getSession();
 if(!session)return location.replace(LOGIN_URL);
 user=session.user;await loadMe();
 $("#out").onclick=async()=>{await sb.auth.signOut();location.replace(LOGIN_URL)};
 addEventListener("hashchange",route);route();if(!me.onboarded)onboard();
}
async function loadMe(){const {data,error}=await sb.from("profiles").select("*").eq("id",user.id).single();if(error)throw error;me=data}
function nav(p){
 const it=[["pulpit","Pulpit",1],["gen","Generator testów"],["klub","Klub Nauczyciela"],["forum","Forum"],["ustawienia","Ustawienia",1]];
 if(me.role==="admin")it.push(["admin","Admin",1]);
 $("#nav").innerHTML=it.map(([k,l,free])=>`<a href="${k==="gen"?GEN_URL:"#/"+k}" class="${p===k?"on":""} ${!free&&!ok()?"lk":""}" ${k==="gen"&&ok()&&GEN_URL!=="#"?'target="_blank"':""}>${!free&&!ok()?"🔒 ":""}${l}</a>`).join("");
}
async function route(){
 const [p,a]=(location.hash.slice(2)||"pulpit").split("/");nav(p);
 try{
  if(!["pulpit","ustawienia"].includes(p)&&!ok())return app(banner());
  await({pulpit:vPulpit,klub:vKlub,forum:vForum,ustawienia:vUst,admin:vAdmin}[p]||vPulpit)(a,location.hash.split("/")[3]);
 }catch(e){app(`<p class="err">Błąd: ${esc(e.message)}</p>`)}
}

/* PULPIT */
async function vPulpit(){
 let th=[],rp=[];
 if(ok())th=(await sb.from("threads").select("id,title,author_name,created_at").order("created_at",{ascending:false}).limit(5)).data||[];
 rp=(await sb.from("reports").select("*").eq("reporter",user.id).not("reply","is",null).order("created_at",{ascending:false}).limit(3)).data||[];
 app(`<h1>Cześć, ${esc(me.first_name)}!</h1>${ok()?`<p class="ok">✓ Konto zweryfikowane</p>`:banner()}
 <div class="grid"><a class="tile" href="${GEN_URL}">📝 Generator testów<br><small>${GEN_URL==="#"?"wkrótce":"przejdź do platformy"}</small></a><a class="tile" href="#/klub">📚 Klub Nauczyciela<br><small>sprawdziany, karty pracy, scenariusze</small></a><a class="tile" href="#/forum">💬 Forum<br><small>rozmowy nauczycieli</small></a></div>
 ${ok()?`<h2>Ostatnie wątki na forum</h2>${th.map(t=>`<a class="card row" style="text-decoration:none;color:inherit" href="#/forum/${t.id}"><b>${esc(t.title)}</b><small>${esc(t.author_name)} · ${when(t.created_at)}</small></a>`).join("")||"<p class='mu'>Brak wątków.</p>"}`:""}
 ${rp.length?`<h2>Odpowiedzi na Twoje zgłoszenia</h2>${rp.map(r=>`<div class="card"><small>${esc(r.label)}</small><br>${esc(r.reply)}</div>`).join("")}`:""}`);
}

/* ONBOARDING */
async function loadSchools(){
 if(SCH)return;
 const j=await(await fetch("/placowki.json")).json();
 SCH=(j.data||j).map(r=>{const a=Array.isArray(r)?r:null,c=a?null:(r.attributes||r),g=i=>a?a[i-1]:c["col"+i];
  const o={w:g(3),p:g(5),m:g(9),id:g(15),n:g(20),u:g(21),nr:g(22),l:g(23),k:g(24)};o.s=`${o.n} ${o.m} ${o.u||""} ${o.w}`.toLowerCase();return o});
}
function onboard(step=1){
 ob=ob||{school:me.school,subjects:[...(me.subjects||[])]};
 const x=me.onboarded?`<button data-act="close" style="float:right;border:0;background:none;font-size:20px;cursor:pointer">✕</button>`:"";
 if(step===1)modal(`${x}<h2>Witaj w Strefie Belfra! 👋</h2><p>Wybierz swoją placówkę.</p>${ob.school?`<div class="card"><b>${esc(ob.school.n)}</b><br><small>${esc(addr(ob.school))}, woj. ${esc(ob.school.w)}</small><br><button class="link" data-act="resch">Zmień</button></div>`:`<input id="q" style="width:100%" placeholder="Wpisz nazwę, miejscowość lub ulicę…"><div id="res"></div>`}<p><button class="btn" data-act="ob2" ${ob.school?"":"disabled"}>Dalej</button></p>`);
 if(step===2)modal(`${x}<h2>Jakich przedmiotów uczysz?</h2>${SUBJ.map(s=>`<label class="chk"><input type="checkbox" data-sub="${s}" ${ob.subjects.includes(s)?"checked":""}>${s}</label>`).join("")}<p><button class="btn o" data-act="ob">← Wstecz</button> <button class="btn" data-act="save">Zapisz</button></p>`);
 if(step===3)modal(`<h2>Dziękujemy!</h2><div class="warn"><b>Musimy zweryfikować Twoje dane!</b><p>Aby uzyskać dostęp do materiałów, prześlij skan lub wyraźne zdjęcie podbitego i podpisanego oświadczenia na adres <a href="mailto:${MAIL}">${MAIL}</a><br>Odpowiemy w ciągu 5 dni roboczych.</p><button class="btn" data-act="pdf">Pobierz oświadczenie</button></div><button class="btn o" data-act="close">Przejdź do pulpitu</button>`);
}
/* PDF */
async function makePdf(){
 const s=me.school||{},L=(a,b)=>`<p style="margin:3px 0"><b>${a}</b> ${esc(b)}</p>`,H=t=>`<h3 style="font-size:15px;margin:16px 0 4px;border-bottom:1px solid #000;padding-bottom:3px">${t}</h3>`;
 const el=document.createElement("div");el.style.cssText="position:fixed;left:-9999px;top:0;width:794px;padding:46px 56px;background:#fff;color:#000;font:13.5px/1.5 Arial,sans-serif";
 el.innerHTML=`<div style="text-align:center"><img src="${SITE}/themes/logo-kolor.png" crossorigin="anonymous" style="width:230px"></div><h2 style="text-align:center;margin:16px 0 18px;font-size:20px">Oświadczenie nauczyciela</h2>
 ${H("Dane osobowe")}${L("Imię i nazwisko:",name())}${L("Email:",me.email)}${L("ID użytkownika:",me.id)}
 ${H("Adres szkoły")}${L("Nazwa placówki:",s.n)}${L("Adres:",`${street(s)}, ${s.k||""}, ${s.m}`)}${L("Województwo:",s.w)}
 ${H("Nauczane przedmioty")}<p style="margin:3px 0">${esc((me.subjects||[]).join(", "))}</p>
 <p style="margin-top:20px">Oświadczam, że podane przeze mnie dane są zgodne z prawdą, oraz upoważniam zespół Strefa Belfra do zweryfikowania autentyczności załączonego zaświadczenia we wskazanej instytucji.</p>
 <p style="margin:26px 0 0">Data: ............................</p>
 <table style="width:100%;margin-top:14px;border-collapse:collapse;text-align:center"><tr>
 <td style="width:34%;height:110px;vertical-align:bottom">.............................<br><small>Podpis nauczyciela</small></td>
 <td style="width:34%;vertical-align:bottom">.............................<br><small>Podpis Dyrektora placówki</small></td>
 <td style="vertical-align:bottom"><div style="border:1px dashed #000;height:95px;margin-bottom:4px"></div><small>Pieczątka placówki</small></td></tr></table>
 <p style="margin-top:26px;font-size:11px;text-align:center">Szczegółowe informacje dotyczące przetwarzania danych osobowych znajdują się pod adresem: ${SITE}/polityka-prywatnosci.</p>`;
 document.body.append(el);
 await Promise.all([...el.querySelectorAll("img")].map(i=>i.complete?1:new Promise(r=>i.onload=i.onerror=r)));
 const d=new window.jspdf.jsPDF({unit:"pt",format:"a4"});
 await new Promise(r=>d.html(el,{callback:r,x:0,y:0,width:595,windowWidth:794,html2canvas:{useCORS:true,scale:2}}));
 el.remove();d.save("oswiadczenie-strefa-belfra.pdf");
}

/* KLUB */
const F={s:"",c:"",t:""};
async function vKlub(){
 const sel=(k,l,a)=>`<select data-k="${k}"><option value="">${l}</option>${opts(a,F[k])}</select>`;
 app(`<h1>Klub Nauczyciela</h1><div class="bar">${sel("s","Przedmiot",SUBJ)}${sel("c","Klasa",CLS)}${sel("t","Rodzaj",TYPES)}</div><div id="list">Ładowanie…</div>`);
 let q=sb.from("materials").select("*").order("created_at",{ascending:false}).limit(100);
 if(F.s)q=q.eq("subject",F.s);if(F.c)q=q.eq("class",F.c);if(F.t)q=q.eq("type",F.t);
 const {data,error}=await q;if(error)throw error;
 $("#list").innerHTML=data.map(m=>`<div class="card row"><div><b>${esc(m.title)}</b><br><span class="tag">${esc(m.subject)}</span><span class="tag">${esc(m.class)}</span><span class="tag">${esc(m.type)}</span></div><div><button class="btn s" data-act="prev" data-key="${esc(m.file_key)}" data-name="${esc(m.title)}">Podgląd</button> <button class="btn s o" data-act="report" data-kind="material" data-ref="${m.id}" data-label="Materiał: ${esc(m.title)}" data-link="#/klub">Zgłoś problem</button></div></div>`).join("")||"<p class='mu'>Brak materiałów dla wybranych filtrów.</p>";
}
async function preview(b){
 modal("<p>Ładowanie podglądu…</p>",1);
 const {url}=await fn("b2",{action:"get",key:b.dataset.key}),ext=b.dataset.key.split(".").pop().toLowerCase(),e=encodeURIComponent(url);
 const v=ext==="pdf"?`<iframe src="${url}#toolbar=0"></iframe>`:["png","jpg","jpeg","gif","webp"].includes(ext)?`<img src="${url}">`:["doc","docx","ppt","pptx","xls","xlsx"].includes(ext)?`<iframe src="https://view.officeapps.live.com/op/embed.aspx?src=${e}"></iframe>`:`<iframe src="https://docs.google.com/gview?embedded=1&url=${e}"></iframe>`;
 modal(`<div class="mh"><b>${esc(b.dataset.name)}</b><button data-act="close">✕</button></div>${v}`,1);
}
function report(b){const d=b.dataset;modal(`<h2>Zgłoś problem</h2><form data-form="rep" data-kind="${esc(d.kind)}" data-ref="${esc(d.ref)}" data-label="${esc(d.label)}" data-link="${esc(d.link)}"><textarea name="reason" required maxlength="2000" placeholder="Opisz, o co chodzi…"></textarea><p><button class="btn">Wyślij zgłoszenie</button> <button type="button" class="btn o" data-act="close">Anuluj</button></p></form>`)}

/* FORUM */
const vForum=id=>id?vThread(id):vThreads();
async function vThreads(){
 const {data}=await sb.from("threads").select("id,title,author_name,created_at").order("created_at",{ascending:false}).limit(100);
 app(`<div class="row"><h1>Forum</h1><button class="btn" data-act="nt">+ Nowy wątek</button></div><form data-form="nt" id="nt" class="card" hidden><input name="title" required maxlength="150" placeholder="Tytuł wątku" style="width:100%;margin-bottom:8px"><textarea name="body" required maxlength="5000" placeholder="Treść"></textarea><p><button class="btn">Opublikuj</button></p></form>${(data||[]).map(t=>`<a class="card row" style="text-decoration:none;color:inherit" href="#/forum/${t.id}"><b>${esc(t.title)}</b><small>${esc(t.author_name)} · ${when(t.created_at)}</small></a>`).join("")||"<p class='mu'>Brak wątków – bądź pierwszy!</p>"}`);
}
async function vThread(id){
 const [{data:t},{data:ps}]=await Promise.all([sb.from("threads").select("*").eq("id",id).single(),sb.from("posts").select("*").eq("thread_id",id).order("created_at")]);
 const adm=me.role==="admin",rb=(k,r,l)=>`<button class="link" data-act="report" data-kind="${k}" data-ref="${r}" data-label="${esc(l)}" data-link="#/forum/${id}">Zgłoś</button>`,dl=(tb,i)=>adm?` <button class="link err" data-act="del" data-tbl="${tb}" data-id="${i}">Usuń</button>`:"";
 app(`<p><a href="#/forum">← Wszystkie wątki</a></p><div class="card"><h1>${esc(t.title)}</h1><small>${esc(t.author_name)} · ${when(t.created_at)}</small><p style="white-space:pre-wrap">${esc(t.body)}</p>${rb("thread",t.id,"Wątek: "+t.title)}${dl("threads",t.id)}</div>
 <h2>Odpowiedzi (${ps.length})</h2>${ps.map(p=>`<div class="card"><small><b>${esc(p.author_name)}</b> · ${when(p.created_at)}</small><p style="white-space:pre-wrap">${esc(p.body)}</p>${rb("post",p.id,"Wiadomość w wątku: "+t.title)}${dl("posts",p.id)}</div>`).join("")}
 <form data-form="reply" data-id="${id}" class="card"><textarea name="body" required maxlength="5000" placeholder="Napisz odpowiedź…"></textarea><p><button class="btn">Odpowiedz</button></p></form>`);
}

/* USTAWIENIA */
async function vUst(){
 app(`<h1>Ustawienia</h1><div class="card"><form data-form="name" class="bar"><input name="f" value="${esc(me.first_name)}" required placeholder="Imię"><input name="l" value="${esc(me.last_name)}" required placeholder="Nazwisko"><button class="btn">Zapisz imię i nazwisko</button></form><p><b>E-mail:</b> ${esc(me.email)}<br><b>ID użytkownika:</b> <small>${me.id}</small></p></div>
 <div class="card"><b>Placówka:</b> ${me.school?esc(me.school.n)+" – "+esc(addr(me.school)):"—"}<br><b>Przedmioty:</b> ${esc((me.subjects||[]).join(", ")||"—")}<p><button class="btn o" data-act="ob">Zmień placówkę i przedmioty</button> <button class="btn o" data-act="pdf" ${me.onboarded?"":"disabled"}>Pobierz oświadczenie</button></p></div>
 <div class="card"><form data-form="pw" class="bar"><input type="password" name="p" minlength="8" required placeholder="Nowe hasło (min. 8 znaków)"><button class="btn">Zmień hasło</button></form></div>${ok()?"":banner()}`);
}

/* ADMIN */
async function vAdmin(sub="users"){
 if(me.role!=="admin")return app("<p>Brak uprawnień.</p>");
 const tb=[["users","Użytkownicy"],["materials","Materiały"],["reports","Zgłoszenia"]];
 const head=`<h1>Panel administratora</h1><div class="bar">${tb.map(([k,l])=>`<a class="btn ${sub===k?"":"o"} s" href="#/admin/${k}">${l}</a>`).join("")}</div>`;
 if(sub==="users"){
  U=(await sb.from("profiles").select("*").order("created_at",{ascending:false}).limit(500)).data;
  app(head+`<input id="us" placeholder="Szukaj użytkownika…" style="width:100%;margin-bottom:10px"><div class="card" style="overflow:auto"><table id="ut"></table></div>`);usersTbl("");
 }
 if(sub==="materials"){
  const {data}=await sb.from("materials").select("*").order("created_at",{ascending:false}).limit(200);
  app(head+`<form data-form="up" class="card"><b>Dodaj materiał do Klubu</b><div class="bar" style="margin-top:8px"><input name="title" required placeholder="Tytuł"><select name="subject">${opts(SUBJ)}</select><select name="cls">${opts(CLS)}</select><select name="type">${opts(TYPES)}</select><input type="file" name="file" required></div><button class="btn">Wyślij</button> <span id="upst"></span></form>${data.map(m=>`<div class="card row"><span><b>${esc(m.title)}</b> <span class="tag">${esc(m.subject)}</span><span class="tag">${esc(m.class)}</span><span class="tag">${esc(m.type)}</span></span><button class="btn s d" data-act="delmat" data-id="${m.id}" data-key="${esc(m.file_key)}">Usuń</button></div>`).join("")}`);
 }
 if(sub==="reports"){
  const {data}=await sb.from("reports").select("*").order("created_at",{ascending:false}).limit(200);
  app(head+(data.map(r=>`<div class="card"><div class="row"><b>${esc(r.label)}</b><small>${r.status==="open"?"🔴 otwarte":"✅ zamknięte"} · ${esc(r.reporter_name)} · ${when(r.created_at)}</small></div><p style="white-space:pre-wrap">${esc(r.reason)}</p>${r.reply?`<p class="ok">Odpowiedź: ${esc(r.reply)}</p>`:""}<a class="btn s o" href="${esc(r.link)}">Przejdź</a> <button class="btn s" data-act="rrep" data-id="${r.id}">Odpisz</button> ${r.status==="open"?`<button class="btn s o" data-act="rclose" data-id="${r.id}">Zamknij</button>`:""}</div>`).join("")||"<p class='mu'>Brak zgłoszeń.</p>"));
 }
}
function usersTbl(q){
 q=q.toLowerCase();
 $("#ut").innerHTML=`<tr><th>Imię i nazwisko</th><th>E-mail</th><th>Rola</th><th>Nauczyciel</th><th>Akcje</th></tr>`+U.filter(u=>(u.first_name+u.last_name+u.email).toLowerCase().includes(q)).map(u=>`<tr><td>${esc(u.first_name)} ${esc(u.last_name)}</td><td>${esc(u.email)}</td><td>${u.role}</td><td>${u.verified?"✅":"—"}</td><td>
 <button class="btn s o" data-act="uv" data-id="${u.id}">${u.verified?"Odbierz upr.":"Nadaj upr."}</button> <button class="btn s o" data-act="ur" data-id="${u.id}">${u.role==="admin"?"→ user":"→ admin"}</button> <button class="btn s o" data-act="un" data-id="${u.id}">Imię/nazwisko</button> <button class="btn s o" data-act="ue" data-id="${u.id}">E-mail</button> <button class="btn s o" data-act="up" data-id="${u.id}">Hasło</button> <button class="btn s d" data-act="ud" data-id="${u.id}">Usuń</button></td></tr>`).join("");
}
const adm=(u,p)=>sb.rpc("admin_update_profile",{uid:u.id,f:p.f??u.first_name,l:p.l??u.last_name,r:p.r??u.role,v:p.v??u.verified}).then(({error})=>{if(error)throw error;return vAdmin("users")});
const gu=b=>U.find(u=>u.id===b.dataset.id);

/* ZDARZENIA */
const acts={
 close,pdf:()=>makePdf().catch(e=>alert("Nie udało się wygenerować PDF: "+e.message)),ob:()=>onboard(1),ob2:()=>onboard(2),
 resch:()=>{ob.school=null;onboard(1)},prev:b=>preview(b).catch(e=>modal(`<p class="err">Błąd podglądu: ${esc(e.message)}</p><button class="btn" data-act="close">OK</button>`)),
 pick:b=>{const {s,...x}=R[b.dataset.i];ob.school=x;onboard(1)},report,nt:()=>$("#nt").hidden=false,
 save:async()=>{if(!ob.subjects.length)return alert("Wybierz co najmniej jeden przedmiot.");
  const {error}=await sb.from("profiles").update({school:ob.school,subjects:ob.subjects,onboarded:true}).eq("id",user.id);if(error)return alert(error.message);
  await loadMe();ob=null;nav("pulpit");onboard(3);route()},
 del:async b=>{if(!confirm("Usunąć?"))return;await sb.from(b.dataset.tbl).delete().eq("id",b.dataset.id);location.hash=b.dataset.tbl==="threads"?"#/forum":"#/forum/"+location.hash.split("/")[2];route()},
 uv:b=>{const u=gu(b);adm(u,{v:!u.verified})},ur:b=>{const u=gu(b);if(confirm("Zmienić rolę?"))adm(u,{r:u.role==="admin"?"user":"admin"})},
 un:b=>{const u=gu(b),f=prompt("Imię",u.first_name);if(!f)return;const l=prompt("Nazwisko",u.last_name);if(l)adm(u,{f,l})},
 ue:async b=>{const u=gu(b),e=prompt("Nowy e-mail",u.email);if(e){await fn("admin-users",{action:"email",id:u.id,email:e});vAdmin("users")}},
 up:async b=>{const p=prompt("Nowe hasło (min. 8 znaków)");if(p&&p.length>=8){await fn("admin-users",{action:"password",id:gu(b).id,password:p});alert("Hasło zmienione.")}},
 ud:async b=>{if(confirm("Usunąć konto bezpowrotnie?")){await fn("admin-users",{action:"delete",id:b.dataset.id});vAdmin("users")}},
 delmat:async b=>{if(!confirm("Usunąć materiał?"))return;await fn("b2",{action:"del",key:b.dataset.key});await sb.from("materials").delete().eq("id",b.dataset.id);vAdmin("materials")},
 rrep:async b=>{const t=prompt("Odpowiedź dla zgłaszającego:");if(t){await sb.from("reports").update({reply:t,status:"closed"}).eq("id",b.dataset.id);vAdmin("reports")}},
 rclose:async b=>{await sb.from("reports").update({status:"closed"}).eq("id",b.dataset.id);vAdmin("reports")}
};
const forms={
 rep:async f=>{const d=f.dataset;const {error}=await sb.from("reports").insert({kind:d.kind,ref_id:d.ref,label:d.label,link:d.link,reason:f.reason.value.trim(),reporter_name:name()});modal(error?`<p class="err">${esc(error.message)}</p>`:`<h2>Dziękujemy!</h2><p>Zgłoszenie zostało wysłane do administratora.</p><button class="btn" data-act="close">OK</button>`)},
 nt:async f=>{const {data,error}=await sb.from("threads").insert({title:f.title.value.trim(),body:f.body.value.trim(),author_name:name()}).select("id").single();if(error)return alert(error.message);location.hash="#/forum/"+data.id},
 reply:async f=>{const {error}=await sb.from("posts").insert({thread_id:f.dataset.id,body:f.body.value.trim(),author_name:name()});if(error)return alert(error.message);vThread(f.dataset.id)},
 name:async f=>{const {error}=await sb.from("profiles").update({first_name:f.f.value.trim(),last_name:f.l.value.trim()}).eq("id",user.id);if(error)return alert(error.message);await loadMe();alert("Zapisano.")},
 pw:async f=>{const {error}=await sb.auth.updateUser({password:f.p.value});alert(error?error.message:"Hasło zostało zmienione.");if(!error)f.reset()},
 up:async f=>{const st=$("#upst"),file=f.file.files[0],ct=file.type||"application/octet-stream";
  try{st.textContent="Wysyłanie…";const key=`materialy/${Date.now()}-${file.name.replace(/[^\w.-]+/g,"_")}`;
  const {url}=await fn("b2",{action:"put",key,contentType:ct});
  const r=await fetch(url,{method:"PUT",headers:{"Content-Type":ct},body:file});if(!r.ok)throw Error("Backblaze odrzucił plik ("+r.status+")");
  const {error}=await sb.from("materials").insert({title:f.title.value.trim(),subject:f.subject.value,class:f.cls.value,type:f.type.value,file_key:key,file_name:file.name,created_by:user.id});if(error)throw error;vAdmin("materials")
  }catch(e){st.innerHTML=`<span class="err">${esc(e.message)}</span>`}}
};
document.addEventListener("click",e=>{const b=e.target.closest("[data-act]");if(b)acts[b.dataset.act]?.(b)});
document.addEventListener("submit",e=>{const f=e.target;if(f.dataset.form){e.preventDefault();forms[f.dataset.form]?.(f)}});
document.addEventListener("change",e=>{const t=e.target;
 if(t.dataset.k){F[t.dataset.k]=t.value;vKlub()}
 if(t.dataset.sub){ob.subjects=t.checked?[...ob.subjects,t.dataset.sub]:ob.subjects.filter(x=>x!==t.dataset.sub)}});
document.addEventListener("input",async e=>{
 if(e.target.id==="us")usersTbl(e.target.value);
 if(e.target.id!=="q")return;
 const v=e.target.value.toLowerCase().trim(),res=$("#res");
 if(v.length<3)return res.innerHTML="<small>Wpisz min. 3 znaki</small>";
 if(!SCH){res.innerHTML="<small>Ładuję listę placówek…</small>";try{await loadSchools()}catch(x){return res.innerHTML=`<span class="err">Nie można wczytać placowki.json</span>`}}
 const t=v.split(/\s+/);R=SCH.filter(s=>t.every(w=>s.s.includes(w))).slice(0,25);
 res.innerHTML=R.map((s,i)=>`<button class="it" data-act="pick" data-i="${i}"><b>${esc(s.n)}</b><br><small>${esc(addr(s))} · ${esc(s.w)}</small></button>`).join("")||"<small>Nie znaleziono placówki.</small>";
});
boot();
</script></body></html>
